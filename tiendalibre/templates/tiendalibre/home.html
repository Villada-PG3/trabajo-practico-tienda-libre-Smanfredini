{% extends "base.html" %}

{% block content %}

<style>
    .productos-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .producto {
        border: 1px solid #ccc;
        padding: 20px;
        text-align: center;
    }
</style>

<h2>Productos recientes</h2>

<div class="row">
    {% for producto in productos_recientes %}
        <div class="col-md-4">
            <div class="card mb-3">
                {% if producto.imagen %}
                    <img
                        src="{{ producto.imagen.url }}"
                        class="card-img-top"
                        alt="{{ producto.nombre }}"
                    >
                {% endif %}

                <div class="card-body">
                    <h5 class="card-title">{{ producto.nombre }}</h5>
                    <p class="card-text">{{ producto.precio }}</p>

                    <a href="{% url 'detalle_producto' producto.pk %}">
                        Ver producto
                    </a>
                </div>
            </div>
        </div>
    {% empty %}
        <p>Todavía no hay productos cargados.</p>
    {% endfor %}
</div>

{% endblock %}
