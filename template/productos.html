<!doctype html>
<html lang="es">
  <body>


    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th> Precio</th>
          <th>Stock</th>
        </tr>
      </thead>

      <tbody>
        {% for producto in productos %}

        <tr>
          <td>{{ producto.nombre }}</td>
          <td>{{ producto.precio }}</td>
          <td>{{ producto.stock }} unidades</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>


  </body>
</html>
